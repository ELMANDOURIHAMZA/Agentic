[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-recruitment"
version = "0.1.0"
description = "Socle du projet universitaire Agentic AI Recruitment Platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.37",
    "alembic==1.14.1",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "argon2-cffi==23.1.0",
    "email-validator==2.2.0",
    "itsdangerous==2.2.0",
    "python-multipart==0.0.20",
    "jinja2==3.1.5",
    "pdfplumber==0.11.5",
    "python-docx==1.1.2",
    "aiosmtplib==3.0.2",
    "httpx==0.28.1",
    "reportlab==4.2.5",
    "pytesseract==0.3.13",
    "pillow>=11",
    "pypdfium2>=4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.4",
    "aiosmtpd==1.4.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that perform real calls to the configured LLM provider",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
