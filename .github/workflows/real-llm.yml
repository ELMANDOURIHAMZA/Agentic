name: Vérifications réelles (LLM, Docker)

# Déclenchement manuel uniquement : ces jobs appellent un fournisseur payant
# (clé lue dans le secret de dépôt GROQ_API_KEY) et construisent l'image Docker.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-llm-tests:
    name: Tests d'intégration avec le LLM réel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recruitment_user
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitment_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      SECRET_KEY: ci-only-secret-not-used-in-production
      LLM_PROVIDER: openai
      LLM_MODEL: openai/gpt-oss-20b
      LLM_BASE_URL: https://api.groq.com/openai
      WORKFLOW_MAX_CONCURRENCY: "1"
      RUN_REAL_LLM_TESTS: "1"
      DATABASE_URL: postgresql+psycopg://recruitment_user:change-me@localhost:5432/recruitment_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Vérifier la présence du secret (sans l'afficher)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Le secret de dépôt GROQ_API_KEY est absent ou vide."
            exit 1
          fi
      - name: Tests réels (les deux tests normalement ignorés)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m pytest -v -p no:cacheprovider \
            tests/test_real_llm_integration.py tests/test_real_http_workflow.py \
            --junitxml=real-llm-report.xml 2>&1 | tee real-llm.log
      - name: Conserver les preuves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preuves-llm-reel
          path: |
            real-llm.log
            real-llm-report.xml
          if-no-files-found: ignore

  full-suite:
    name: Suite complète (LLM simulé)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recruitment_user
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitment_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      SECRET_KEY: ci-only-secret-not-used-in-production
      DATABASE_URL: postgresql+psycopg://recruitment_user:change-me@localhost:5432/recruitment_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q -p no:cacheprovider -rs

  docker:
    name: Build et démarrage Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Préparer .env (secret de session aléatoire)
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(openssl rand -hex 32)|" .env
      - name: Construire et démarrer
        run: docker compose up --build -d
      - name: Attendre /health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 3
          done
          echo "::error::/health ne répond pas"
          docker compose ps
          docker compose logs --no-color app | tail -80
          exit 1
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color | tail -150
      - name: Arrêter
        if: always()
        run: docker compose down -v
