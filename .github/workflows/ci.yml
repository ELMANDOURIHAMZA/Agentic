name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recruitment_db
          POSTGRES_USER: recruitment_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitment_user -d recruitment_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Verify Git LFS datasets
        run: python scripts/verify_datasets.py
      - name: Apply database migrations
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://recruitment_user:test-password@localhost:5432/recruitment_db
          POSTGRES_PASSWORD: test-password
          SECRET_KEY: ci-secret
          APP_ENV: test
      - name: Run unit and integration-safe tests
        run: python -m pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://recruitment_user:test-password@localhost:5432/recruitment_db
          POSTGRES_PASSWORD: test-password
          SECRET_KEY: ci-secret
          APP_ENV: test
      - name: Build Docker image
        run: docker build -t agentic-ai-recruitment:ci .

  real-groq:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: real-llm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Require configured Groq secret
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::GROQ_API_KEY is not configured in the repository/environment secrets."
            exit 1
          fi
      - name: Run five-agent Groq integration test with synthetic data
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_REAL_LLM_TESTS: "1"
          LLM_PROVIDER: groq
          LLM_MODEL: openai/gpt-oss-120b
          LLM_BASE_URL: https://api.groq.com/openai
          SECRET_KEY: ci-secret
          APP_ENV: test
        run: python -m pytest tests/test_real_llm_integration.py -m integration -q
