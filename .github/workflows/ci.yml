name: CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recruitment_db
          POSTGRES_USER: recruitment_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitment_user -d recruitment_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python scripts/verify_datasets.py
      - run: python -m pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://recruitment_user:test-password@localhost:5432/recruitment_db
          POSTGRES_PASSWORD: test-password
          SECRET_KEY: ci-secret
          APP_ENV: test

  real-groq:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: real-llm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recruitment_db
          POSTGRES_USER: recruitment_user
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitment_user -d recruitment_db"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Run authorised Groq integration tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RUN_REAL_LLM_TESTS: "1"
          LLM_PROVIDER: groq
          LLM_MODEL: openai/gpt-oss-120b
          LLM_BASE_URL: https://api.groq.com/openai
          DATABASE_URL: postgresql+psycopg://recruitment_user:test-password@localhost:5432/recruitment_db
          POSTGRES_PASSWORD: test-password
          SECRET_KEY: ci-secret
          APP_ENV: test
        run: python -m pytest -m integration -q
