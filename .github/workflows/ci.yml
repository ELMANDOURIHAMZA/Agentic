name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: recruitment_db
          POSTGRES_USER: recruitment_user
          POSTGRES_PASSWORD: change-me
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recruitment_user -d recruitment_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://recruitment_user:change-me@127.0.0.1:5432/recruitment_db
      SECRET_KEY: ci-only-secret-key-not-for-production
      POSTGRES_PASSWORD: change-me
      APP_ENV: development
      LLM_PROVIDER: groq
      GROQ_API_KEY: ""
      LLM_MODEL: openai/gpt-oss-120b
      SMTP_HOST: ""
      RUN_REAL_LLM_TESTS: "0"
      WORKFLOW_BATCH_CONCURRENCY: "3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-fra tesseract-ocr-ara

      - name: Install application and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Test suite (no live Groq calls)
        run: python -m pytest -q

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Build Docker image
        run: docker build -t agentic-recruitment:ci .

      - name: Verify database migration head
        run: python -m alembic current
