<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 440px">
  <a class="d-block mb-3 text-decoration-none" href="/">&larr; Offres d'emploi</a>
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Connexion</h1>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="vstack gap-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next }}">
      <div><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" name="email" required autocomplete="email"></div>
      <div><label class="form-label" for="password">Mot de passe</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit">Se connecter</button>
    </form>
    <p class="mt-3 mb-0 small">Pas de compte ? <a href="/register">Créer un compte candidat</a></p>
  </div></div>
</main>
</body>
</html>
