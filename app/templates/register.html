<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px">
  <a class="d-block mb-3 text-decoration-none" href="/">&larr; Offres d'emploi</a>
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3">Inscription candidat</h1>
    {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/register" class="vstack gap-3">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="row g-2">
        <div class="col-6"><label class="form-label" for="first_name">Prénom</label><input class="form-control" id="first_name" name="first_name" required></div>
        <div class="col-6"><label class="form-label" for="last_name">Nom</label><input class="form-control" id="last_name" name="last_name" required></div>
      </div>
      <div><label class="form-label" for="email">Email</label><input class="form-control" id="email" type="email" name="email" required autocomplete="email"></div>
      <div><label class="form-label" for="password">Mot de passe</label><input class="form-control" id="password" type="password" name="password" required minlength="12" autocomplete="new-password"><div class="form-text">12 caractères minimum, avec majuscule, minuscule, chiffre et symbole.</div></div>
      <button class="btn btn-primary" type="submit">S'inscrire</button>
    </form>
    <p class="mt-3 mb-0 small">Déjà inscrit ? <a href="/login">Se connecter</a></p>
  </div></div>
</main>
</body>
</html>
