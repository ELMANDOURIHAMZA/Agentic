{% extends "candidate/base.html" %}
{% block title %}Mon profil{% endblock %}
{% block content %}
<h1>Mon profil</h1>
<form method="post" action="/candidate/profile" class="vstack gap-3">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Prénom<input class="form-control" name="first_name" value="{{ user.first_name }}" required maxlength="100"></label>
  <label>Nom<input class="form-control" name="last_name" value="{{ user.last_name }}" required maxlength="100"></label>
  <label>Téléphone<input class="form-control" name="phone" value="{{ user.phone or '' }}" maxlength="30"></label>
  <label>Email<input class="form-control" value="{{ user.email }}" disabled></label>
  <button class="btn btn-primary">Enregistrer</button>
</form>
{% endblock %}
